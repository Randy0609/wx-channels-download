name: Validate Skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency without browser binaries
        run: python -m pip install --disable-pip-version-check "playwright>=1.52,<2"
      - name: Validate package structure and Python syntax
        run: |
          python tests/validate_skill_package.py
          python -m py_compile scripts/yuanbao_channels.py tools/build_release.py tests/*.py
      - name: Run safety regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  macos-shell-validation:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate zsh runners
        run: |
          zsh -n scripts/run_macos.sh
          zsh -n scripts/setup_macos.sh

  windows-powershell-validation:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell runners
        shell: pwsh
        run: |
          function Test-PowerShellSyntax([string]$Path) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          Test-PowerShellSyntax 'scripts/run.ps1'
          Test-PowerShellSyntax 'scripts/setup.ps1'
